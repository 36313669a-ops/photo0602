<script>

const gallery = document.getElementById("gallery");

for(let i=1;i<=65;i++){

    const id = String(i).padStart(3,"0");

    const card = document.createElement("div");

    card.className = "photo-card";

    const imgPath = `PHOTO/${id}.jpg`;

    card.innerHTML = `

        <img
            src="${imgPath}"
            alt="作品${id}"

            onerror="
                this.src='https://placehold.co/800x600?text=${id}'
            "
        >

        <div class="info">

            <h3>作品 ${id}</h3>

            <a class="btn" href="vote.html?id=${id}">
                查看 / 投票
            </a>

        </div>

    `;

    gallery.appendChild(card);
}

</script>
