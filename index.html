<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>攝影比賽線上投票</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Microsoft JhengHei",sans-serif;
    background:#f5f5f5;
}

/* 頂部 */

header{
    background:#222;
    color:white;
    text-align:center;
    padding:25px 15px;
}

header h1{
    font-size:2rem;
}

header p{
    margin-top:10px;
    color:#ddd;
}

/* 作品區 */

.gallery{

    width:95%;
    max-width:1800px;

    margin:30px auto;

    column-count:4;
    column-gap:20px;

}

/* 卡片 */

.photo-card{

    break-inside:avoid;
    margin-bottom:20px;

    background:white;

    border-radius:12px;

    overflow:hidden;

    box-shadow:
    0 2px 10px rgba(0,0,0,.1);

    transition:.3s;
}

.photo-card:hover{

    transform:translateY(-5px);

    box-shadow:
    0 6px 20px rgba(0,0,0,.15);
}

.photo-card img{

    width:100%;
    height:auto;

    display:block;
}

/* 下方資訊 */

.info{

    padding:15px;
}

.info h3{

    margin-bottom:10px;
    color:#333;
}

.btn{

    display:block;

    width:100%;

    text-align:center;

    text-decoration:none;

    background:#0066cc;

    color:white;

    padding:10px;

    border-radius:8px;

    transition:.3s;
}

.btn:hover{

    background:#004d99;
}

/* 平板 */

@media(max-width:1200px){

.gallery{
    column-count:3;
}

}

/* 手機 */

@media(max-width:768px){

.gallery{
    column-count:2;
}

header h1{
    font-size:1.5rem;
}

}

/* 小手機 */

@media(max-width:480px){

.gallery{
    column-count:1;
}

}

</style>
</head>

<body>

<header>

<h1>攝影比賽線上投票</h1>

<p>
點選作品即可查看大圖並進行投票
</p>

</header>

<div class="gallery" id="gallery"></div>

<script>

const gallery =
document.getElementById("gallery");

/*
照片編號
001~065
*/

for(let i=1;i<=65;i++){

    const num =
    String(i).padStart(3,"0");

    const card = document.createElement("div");

    card.className = "photo-card";

    card.innerHTML = `

        <img
        src="PHOTO/${num}.jpg"
        alt="作品${num}"

        onerror="
        this.src='https://placehold.co/800x600?text=${num}'
        "
        >

        <div class="info">

            <h3>
            作品編號 ${num}
            </h3>

            <a
            class="btn"
            href="vote.html?id=${num}"
            >
            查看作品 / 我要投票
            </a>

        </div>

    `;

    gallery.appendChild(card);
}

</script>

</body>
</html>
