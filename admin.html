<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>攝影比賽後台</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Microsoft JhengHei",sans-serif;
    background:#f5f5f5;
}

header{
    background:#222;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    width:95%;
    max-width:1200px;
    margin:20px auto;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
    margin-bottom:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.card h3{
    margin-bottom:10px;
}

.big{
    font-size:32px;
    font-weight:bold;
    color:#0066cc;
}

.tools{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:20px;
}

input{
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
}

button{
    border:none;
    cursor:pointer;
    padding:10px 15px;
    border-radius:6px;
    color:white;
}

.refresh{
    background:#0066cc;
}

.export{
    background:#28a745;
}

.clear{
    background:#dc3545;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

th{
    background:#333;
    color:white;
}

th,td{
    padding:12px;
    text-align:center;
    border-bottom:1px solid #ddd;
}

tr:hover{
    background:#f9f9f9;
}

.rank1{
    background:#fff7cc;
}

.rank2{
    background:#f2f2f2;
}

.rank3{
    background:#ffe4c4;
}

@media(max-width:768px){

table{
    font-size:14px;
}

.tools{
    flex-direction:column;
}

input,
button{
    width:100%;
}

}

</style>
</head>

<body>

<header>
<h1>攝影比賽後台管理</h1>
</header>

<div class="container">

<div class="dashboard">

<div class="card">
<h3>總票數</h3>
<div class="big" id="totalVotes">0</div>
</div>

<div class="card">
<h3>參賽作品</h3>
<div class="big">65</div>
</div>

<div class="card">
<h3>目前第一名</h3>
<div class="big" id="winner">---</div>
</div>

</div>

<div class="tools">

<input
type="text"
id="search"
placeholder="搜尋作品編號">

<button
class="refresh"
onclick="loadData()">
重新整理
</button>

<button
class="export"
onclick="exportCSV()">
匯出CSV
</button>

<button
class="clear"
onclick="clearVotes()">
清空測試票數
</button>

</div>

<table>

<thead>

<tr>
<th>排名</th>
<th>作品編號</th>
<th>票數</th>
</tr>

</thead>

<tbody id="resultBody">
</tbody>

</table>

</div>

<script>

function loadData(){

    let votes =
    JSON.parse(
    localStorage.getItem("votes")
    || "{}"
    );

    let data = [];

    let totalVotes = 0;

    for(let i=1;i<=65;i++){

        let id =
        String(i).padStart(3,"0");

        let count =
        votes[id] || 0;

        totalVotes += count;

        data.push({
            id:id,
            votes:count
        });
    }

    data.sort(
    (a,b)=>b.votes-a.votes
    );

    document.getElementById(
    "totalVotes"
    ).innerText = totalVotes;

    if(data.length>0){

        document.getElementById(
        "winner"
        ).innerText =
        data[0].id;
    }

    renderTable(data);
}

function renderTable(data){

    const keyword =
    document.getElementById("search")
    .value.trim();

    let html = "";

    let rank = 1;

    data.forEach(item=>{

        if(
            keyword &&
            !item.id.includes(keyword)
        ){
            return;
        }

        let cls="";

        if(rank===1) cls="rank1";
        if(rank===2) cls="rank2";
        if(rank===3) cls="rank3";

        html += `

        <tr class="${cls}">

            <td>${rank}</td>

            <td>${item.id}</td>

            <td>${item.votes}</td>

        </tr>

        `;

        rank++;

    });

    document.getElementById(
    "resultBody"
    ).innerHTML = html;
}

document
.getElementById("search")
.addEventListener(
"input",
loadData
);

function exportCSV(){

    let votes =
    JSON.parse(
    localStorage.getItem("votes")
    || "{}"
    );

    let csv =
    "作品編號,票數\n";

    for(let i=1;i<=65;i++){

        let id =
        String(i).padStart(3,"0");

        csv +=
        `${id},${votes[id]||0}\n`;
    }

    let blob =
    new Blob(
    [csv],
    {
        type:"text/csv;charset=utf-8;"
    });

    let url =
    URL.createObjectURL(blob);

    let a =
    document.createElement("a");

    a.href = url;

    a.download =
    "攝影比賽票數.csv";

    a.click();

    URL.revokeObjectURL(url);
}

function clearVotes(){

    if(
    confirm(
    "確定清除所有測試票數？"
    )
    ){

        localStorage.removeItem(
        "votes"
        );

        loadData();

        alert("已清除");
    }
}

loadData();

</script>

</body>
</html>
