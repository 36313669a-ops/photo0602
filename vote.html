<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>作品投票</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Microsoft JhengHei",sans-serif;
    background:#f5f5f5;
}

/* 頂部 */

header{
    background:#222;
    color:white;
    text-align:center;
    padding:20px;
}

header h1{
    font-size:1.8rem;
}

/* 主內容 */

.container{

    max-width:1200px;

    margin:30px auto;

    padding:20px;
}

/* 照片區 */

.photo-box{

    background:white;

    border-radius:12px;

    overflow:hidden;

    box-shadow:
    0 2px 10px rgba(0,0,0,.1);
}

.photo-box img{

    width:100%;
    height:auto;
    display:block;
}

/* 資訊 */

.info{

    padding:25px;
}

.info h2{
    margin-bottom:15px;
}

.info p{

    margin-bottom:10px;

    font-size:1.1rem;
}

/* 按鈕區 */

.btn-area{

    margin-top:25px;

    display:flex;

    flex-wrap:wrap;

    gap:10px;
}

button,
a.btn{

    border:none;

    padding:12px 20px;

    border-radius:8px;

    cursor:pointer;

    text-decoration:none;

    color:white;

    font-size:16px;
}

.vote-btn{

    background:#28a745;
}

.vote-btn:hover{

    background:#1e7e34;
}

.undo-btn{

    background:#dc3545;
}

.undo-btn:hover{

    background:#b52a37;
}

.home-btn{

    background:#0066cc;
}

.home-btn:hover{

    background:#004a99;
}

/* 票數顯示 */

.vote-count{

    margin-top:20px;

    padding:15px;

    background:#eef6ff;

    border-radius:10px;

    font-size:1.2rem;

    font-weight:bold;
}

/* 手機 */

@media(max-width:768px){

.btn-area{

    flex-direction:column;
}

button,
a.btn{

    width:100%;
}

}

</style>
</head>

<body>

<header>
<h1>攝影作品投票</h1>
</header>

<div class="container">

    <div class="photo-box">

        <img
        id="photo"
        src=""
        alt="作品照片"
        >

        <div class="info">

            <h2 id="title">
                作品編號
            </h2>

            <p>
                攝影者：
                <span id="author"></span>
            </p>

            <div class="vote-count">

                目前票數：
                <span id="voteCount">0</span>

            </div>

            <div class="btn-area">

                <button
                class="vote-btn"
                onclick="vote()">
                我要投票
                </button>

                <button
                class="undo-btn"
                onclick="undoVote()">
                撤回測試票數
                </button>

                <a
                href="index.html"
                class="btn home-btn">
                返回首頁
                </a>

            </div>

        </div>

    </div>

</div>

<script>

/*
=========================
取得網址參數
=========================
*/

const id =
new URLSearchParams(
location.search
).get("id");

/*

*/

"024":"攝影者024",
"025":"攝影者025",
"026":"攝影者026",

};

/*
=========================
載入照片
=========================
*/

document.getElementById("photo").src =
`PHOTO/${id}.jpg`;

document.getElementById("photo").onerror =
function(){

    this.src =
    "https://placehold.co/1200x800?text=Photo+"+id;
};

document.getElementById("title").innerText =
`作品編號 ${id}`;

document.getElementById("author").innerText =
authors[id] || "未設定";

/*
=========================
票數系統
=========================
*/

let votes =
JSON.parse(
localStorage.getItem("votes")
|| "{}"
);

if(!votes[id]){
    votes[id]=0;
}

updateVote();

/*
=========================
投票
=========================
*/

function vote(){

    votes[id]++;

    saveVotes();

    alert("投票成功！");
}

/*
=========================
撤回票數
=========================
*/

function undoVote(){

    if(votes[id] > 0){

        votes[id]--;

        saveVotes();

        alert("已撤回一票");
    }
}

/*
=========================
存檔
=========================
*/

function saveVotes(){

    localStorage.setItem(
        "votes",
        JSON.stringify(votes)
    );

    updateVote();
}

/*
=========================
更新畫面
=========================
*/

function updateVote(){

    document.getElementById(
        "voteCount"
    ).innerText =
    votes[id];
}

</script>

</body>
</html>
