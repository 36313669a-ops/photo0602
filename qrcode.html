<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>65張QRCode產生器</title>

<style>

body{
    font-family:Arial;
    margin:0;
    padding:20px;
    background:#f5f5f5;
}

/* 工具列 */
.top{
    text-align:center;
    margin-bottom:20px;
}

button{
    padding:10px 15px;
    border:none;
    background:#0066cc;
    color:white;
    border-radius:6px;
    cursor:pointer;
}

/* QR grid */
.grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:15px;
}

/* QR卡片 */
.card{
    background:white;
    padding:10px;
    text-align:center;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.card img{
    width:100%;
    max-width:120px;
}

.code{
    margin-top:5px;
    font-weight:bold;
}

/* 列印優化 */
@media print{

button,.top{
    display:none;
}

body{
    background:white;
}

.card{
    box-shadow:none;
    break-inside:avoid;
}

.grid{
    grid-template-columns:repeat(5,1fr);
}

}

</style>
</head>

<body>

<div class="top">
<h2>QRCode 65張產生器</h2>
<button onclick="window.print()">列印 / 存成PDF</button>
</div>

<div class="grid" id="grid"></div>

<!-- QRCode library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>

/* 🔥 改成你的網站網址 */
const baseURL =
"https://YOUR-GITHUB-PAGES-URL";

const grid =
document.getElementById("grid");

for(let i=1;i<=65;i++){

    const id =
    String(i).padStart(3,"0");

    const url =
    `${baseURL}/vote.html?id=${id}`;

    const card =
    document.createElement("div");

    card.className = "card";

    const qrDiv =
    document.createElement("div");

    const label =
    document.createElement("div");

    label.className = "code";
    label.innerText = id;

    card.appendChild(qrDiv);
    card.appendChild(label);
    grid.appendChild(card);

    new QRCode(qrDiv,{
        text:url,
        width:120,
        height:120
    });
}

</script>

</body>
</html>
